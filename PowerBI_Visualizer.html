<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBI AI Bridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Noto+Serif+TC:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FAF9F5;
            --surface: #FFFFFF;
            --surface-2: #F5F4ED;
            --hover: #F0EEE6;
            --border: #E8E6DC;
            --border-strong: #D6D3C6;
            --text: #141413;
            --text-2: #3D3D3A;
            --muted: #73726C;
            --accent: #D97757;
            --accent-strong: #B9573A;
            --accent-soft: #F6E7E0;
            --on-accent: #FFFFFF;
            --code-bg: #F5F4ED;
            --code-text: #3D3D3A;
            --ok: #5E8C61;
            --danger: #B5483A;
            --danger-soft: #F7E4E0;
            --shadow: 0 1px 2px rgba(20, 20, 19, 0.04), 0 6px 20px rgba(20, 20, 19, 0.04);
            --radius: 12px;
            --serif: "Source Serif 4", "Noto Serif TC", Georgia, "PMingLiU", serif;
            --sans: ui-sans-serif, system-ui, "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
            --mono: "JetBrains Mono", "Cascadia Code", Consolas, "Microsoft JhengHei UI", monospace;
            color-scheme: light;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #262624; --surface: #30302E; --surface-2: #2B2B29; --hover: #393936;
                --border: #3E3E3A; --border-strong: #4C4C47;
                --text: #FAF9F5; --text-2: #E3E1D8; --muted: #A3A097;
                --accent: #D97757; --accent-strong: #E8937A; --accent-soft: rgba(217, 119, 87, 0.16); --on-accent: #FFFFFF;
                --code-bg: #1F1E1D; --code-text: #E3E1D8;
                --ok: #8DB38F;
                --danger: #E3907F; --danger-soft: rgba(227, 144, 127, 0.14);
                --shadow: none;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --bg: #262624; --surface: #30302E; --surface-2: #2B2B29; --hover: #393936;
            --border: #3E3E3A; --border-strong: #4C4C47;
            --text: #FAF9F5; --text-2: #E3E1D8; --muted: #A3A097;
            --accent: #D97757; --accent-strong: #E8937A; --accent-soft: rgba(217, 119, 87, 0.16); --on-accent: #FFFFFF;
            --code-bg: #1F1E1D; --code-text: #E3E1D8;
            --ok: #8DB38F;
            --danger: #E3907F; --danger-soft: rgba(227, 144, 127, 0.14);
            --shadow: none;
            color-scheme: dark;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { height: 100%; }
        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.55 var(--sans);
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        svg.i {
            width: 16px; height: 16px; flex: none;
            stroke: currentColor; fill: none; stroke-width: 1.75;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── 頂列 ─────────────────────────────────────────── */
        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 16px;
            flex-wrap: wrap; padding: 12px 24px; border-bottom: 1px solid var(--border);
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .mark {
            width: 34px; height: 34px; border-radius: 9px; flex: none;
            background: var(--accent); color: #FFFFFF; display: grid; place-items: center;
        }
        .mark svg.i { width: 20px; height: 20px; }
        .brand-name { font-family: var(--serif); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
        .brand-sub { font-size: 12px; color: var(--muted); }

        .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .field {
            display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
            background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--muted);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
        .field input, .field select {
            border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; min-width: 0;
        }
        .field select option { background: var(--surface); color: var(--text); }
        .search-field input { width: 170px; }      /* 再寬的話，1280 寬的螢幕上頂列會折成兩行 */
        .select-field select { max-width: 260px; cursor: pointer; }
        kbd {
            font: 11px/1 var(--mono); padding: 3px 5px; border-radius: 5px;
            border: 1px solid var(--border); background: var(--surface-2); color: var(--muted);
        }

        .btn {
            display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px;
            border-radius: 10px; border: 1px solid transparent; font: 500 14px/1 var(--sans);
            cursor: pointer; text-decoration: none; white-space: nowrap;
            transition: background 0.15s, border-color 0.15s, color 0.15s;
        }
        .btn:focus-visible, .tab:focus-visible, .table-item:focus-visible, .copy:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 2px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #refreshBtn:disabled { cursor: progress; }
        .btn-primary { background: var(--accent); color: var(--on-accent); }
        .btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
        .btn-ghost { background: transparent; color: var(--text-2); border-color: var(--border); }
        .btn-ghost:hover { background: var(--hover); }
        .btn-icon { width: 36px; padding: 0; justify-content: center; background: transparent; color: var(--text-2); border-color: var(--border); }
        .btn-icon:hover { background: var(--hover); }
        .btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }

        /* ── 版面 ─────────────────────────────────────────── */
        .layout { flex: 1; display: flex; min-height: 0; }
        .sidebar { width: 288px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
        .sidebar-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 20px 8px; font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: 0.04em;
        }
        .table-list { overflow-y: auto; padding: 4px 10px 16px; }
        .table-item {
            width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px;
            padding: 9px 12px; border: 0; border-radius: 8px; background: transparent;
            color: var(--text); font: inherit; cursor: pointer; position: relative;
        }
        .table-item:hover { background: var(--hover); }
        .table-item.active { background: var(--accent-soft); }
        .table-item.active::before {
            content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 3px; border-radius: 3px; background: var(--accent);
        }
        .table-item .name { display: flex; align-items: center; gap: 8px; font-weight: 500; min-width: 0; }
        .table-item .name svg.i { color: var(--muted); }
        .table-item.active .name svg.i { color: var(--accent); }
        .table-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .table-item .meta { font-size: 12px; color: var(--muted); padding-left: 24px; }

        .badge {
            font-size: 11px; line-height: 1.5; padding: 0 7px; border-radius: 999px; white-space: nowrap; font-weight: 500;
            background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
        }
        .badge-match { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }

        .main { flex: 1; overflow-y: auto; min-width: 0; }
        .page { max-width: 1120px; margin: 0 auto; padding: 32px 40px 64px; }
        .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
        .page-head h1 {
            font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -0.015em;
            margin: 0 0 4px; line-height: 1.25; word-break: break-word;
        }
        .page-head p { margin: 0; color: var(--muted); }
        .sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
        .sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

        .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
        .tab {
            display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; margin-bottom: -1px;
            border: 0; border-bottom: 2px solid transparent; background: transparent;
            color: var(--muted); font: 500 14px/1 var(--sans); cursor: pointer;
        }
        .tab:hover { color: var(--text); }
        .tab.active { color: var(--text); border-bottom-color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
        .card-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--border); }
        .card-head h2 { margin: 0; font-family: var(--serif); font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        .card-head h2 svg.i { color: var(--accent); }

        .rows { list-style: none; margin: 0; padding: 6px; }
        .row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; }
        .row:hover { background: var(--hover); }
        .row.hit { background: var(--accent-soft); }
        .row.measure { align-items: flex-start; }
        .row-main { flex: 1; min-width: 0; }
        .row-name { font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; word-break: break-word; }
        .row-sub { font: 12px/1.5 var(--mono); color: var(--muted); }
        .dax {
            margin: 8px 0 2px; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
            font: 12.5px/1.6 var(--mono); color: var(--code-text); white-space: pre-wrap; word-break: break-word;
        }
        .copy {
            display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; cursor: pointer;
            border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted);
        }
        .copy:hover { color: var(--accent-strong); border-color: var(--border-strong); }
        @media (hover: hover) {
            .copy { opacity: 0; transition: opacity 0.12s; }
            .row:hover .copy, .copy:focus-visible { opacity: 1; }
        }
        .empty-row { padding: 22px 16px; text-align: center; color: var(--muted); font-size: 13px; }

        .notice {
            display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; margin-bottom: 14px;
            border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 13px;
        }
        .notice svg.i { color: var(--accent); margin-top: 2px; }
        .code-block { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
        .code-toolbar {
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
            padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted);
        }
        .code-block pre { margin: 0; padding: 20px 22px; font: 13px/1.7 var(--mono); color: var(--code-text); white-space: pre-wrap; word-break: break-word; }

        .state { max-width: 540px; margin: 12vh auto 0; text-align: center; padding: 0 24px 48px; }
        .state-icon {
            width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; margin: 0 auto 16px;
            background: var(--surface-2); color: var(--muted); border: 1px solid var(--border);
        }
        .state-icon svg.i { width: 22px; height: 22px; }
        .state h2 { font-family: var(--serif); font-size: 22px; font-weight: 600; margin: 0 0 8px; }
        .state p { color: var(--muted); margin: 0; }
        .state.error .state-icon { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
        .checklist {
            list-style: none; text-align: left; margin: 20px 0 0; padding: 8px 18px;
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        }
        .checklist li { display: flex; gap: 12px; padding: 8px 0; color: var(--text-2); }
        .checklist li + li { border-top: 1px solid var(--border); }
        .checklist b { color: var(--accent-strong); font-weight: 600; min-width: 1em; }
        .detail { margin-top: 14px; font: 12px/1.5 var(--mono); color: var(--muted); word-break: break-word; }

        #toast {
            position: fixed; left: 16px; right: 16px; bottom: 24px; margin: 0 auto; width: fit-content; z-index: 6;
            transform: translateY(16px); opacity: 0; pointer-events: none;
            display: flex; align-items: center; gap: 8px; max-width: min(720px, calc(100vw - 32px));
            padding: 10px 16px; border-radius: 18px; background: var(--text); color: var(--bg); font-size: 13px;
            transition: opacity 0.18s, transform 0.18s;
        }
        #toast.show { opacity: 1; transform: translateY(0); }
        #toast span { min-width: 0; overflow-wrap: anywhere; }

        /* ── 檢視切換（模型結構 / 資料保護）──────────────── */
        .viewswitch {
            display: inline-flex; padding: 3px; gap: 2px; margin-left: 12px;
            background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px;
        }
        .vs {
            display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 12px;
            border: 0; border-radius: 8px; background: transparent; color: var(--muted);
            font: 500 13.5px/1 var(--sans); cursor: pointer; white-space: nowrap;
        }
        .vs:hover { color: var(--text); }
        .vs.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
        .vs.active svg.i { color: var(--accent); }
        .vs:focus-visible, .seg button:focus-visible, .chip:focus-visible, .ptable > summary:focus-visible,
        .guide > summary:focus-visible, .hint:focus-visible, .skip:focus-visible {
            outline: 2px solid var(--accent); outline-offset: 2px;
        }

        /* ── 資料保護 ─────────────────────────────────────── */
        /* 顏色只有三個意思：反白＝受限、陶土色＝等你處理（建議、未儲存）、紅＝放寬與錯誤。
           「開放」不上色 —— 它是九成的列；而且綠色在權限表格裡會被讀成「允許」，在這裡意思正好相反。 */
        .guide { margin-bottom: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
        .guide > summary { padding: 11px 14px; cursor: pointer; font-weight: 500; color: var(--text-2); list-style-position: inside; }
        .guide[open] > summary { border-bottom: 1px solid var(--border); }
        .levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 14px 14px 4px; }
        .level {
            padding: 12px 14px; background: var(--surface-2); border: 1px solid var(--border);
            border-top: 3px solid var(--text); border-radius: 10px;
        }
        .level.open { border-top-color: var(--border-strong); }
        .level h3 { margin: 0 0 6px; font: 600 14px/1.3 var(--sans); }
        .level p { margin: 0 0 4px; font-size: 12.5px; color: var(--text-2); }
        .level .eg {
            margin: 6px 0; padding: 5px 8px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border);
            font: 12px/1.5 var(--mono); color: var(--text-2); word-break: break-word;
        }
        .level .fit { font-size: 12px; color: var(--muted); }
        .guide h4 { margin: 12px 18px 0; font: 600 13px/1.4 var(--sans); color: var(--text-2); }
        .guide ol { margin: 0; padding: 6px 18px 6px 38px; color: var(--text-2); }
        .guide li { padding: 3px 0; }
        .guide .fine { padding: 4px 18px 14px; margin: 0; font-size: 12.5px; color: var(--muted); }

        .notice.warn { background: var(--danger-soft); border-color: transparent; }
        .notice.warn svg.i { color: var(--danger); }
        .notice { flex-wrap: wrap; }
        .notice .grow { flex: 1 1 260px; min-width: 0; }
        .notice .btn { flex: none; }
        .page.prot { padding-bottom: 150px; }       /* 底下浮著儲存列，最後幾列要捲得上來 */

        .prot-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
        .chip {
            display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; cursor: pointer;
            border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--text-2);
            font: 500 13px/1 var(--sans);
        }
        .chip:hover { background: var(--hover); }
        .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }
        .chip b { font-weight: 600; font-variant-numeric: tabular-nums; }
        .chip.todo:not(.active) { border-color: var(--accent); color: var(--accent-strong); }

        .bulk {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; padding: 8px 12px;
            border: 1px dashed var(--border-strong); border-radius: 10px; font-size: 13px; color: var(--text-2);
        }
        .bulk .fine { color: var(--muted); font-size: 12px; }
        .bulk.muted { border-style: solid; border-color: var(--border); color: var(--muted); font-size: 12.5px; }

        .ptable { margin-bottom: 12px; }
        .ptable > summary {
            display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; list-style: none;
        }
        .ptable > summary::-webkit-details-marker { display: none; }
        .ptable > summary .caret { color: var(--muted); transition: transform 0.12s; }
        .ptable[open] > summary .caret { transform: rotate(90deg); }
        .ptable[open] > summary { border-bottom: 1px solid var(--border); }
        .ptable .tname { font-family: var(--serif); font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ptable .tcount { font-size: 12px; color: var(--muted); white-space: nowrap; }
        .ptable .tcount .r { color: var(--text); font-weight: 600; }
        .ptable .tcount .s { color: var(--accent-strong); }
        .ptable .grow { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }

        .prow { display: flex; align-items: center; gap: 12px; padding: 7px 12px; border-radius: 8px; }
        .prow.restricted { background: var(--surface-2); }
        .prow:hover { background: var(--hover); }
        .prow.hit .row-name { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
        .prow.dirty { box-shadow: inset 3px 0 0 var(--accent); }
        .prow .lock { width: 14px; height: 14px; color: var(--text-2); }
        .prow .src { font: 12px/1.5 var(--sans); color: var(--muted); }
        .prow .src .loosen { color: var(--danger); font-weight: 500; }
        .hintwrap { flex: none; display: inline-flex; align-items: center; gap: 4px; }
        .hint {
            display: inline-flex; align-items: center; height: 26px; padding: 0 10px; cursor: pointer;
            border: 1px solid transparent; border-radius: 999px; background: var(--accent-soft); color: var(--accent-strong);
            font: 500 12px/1 var(--sans); white-space: nowrap;
        }
        .hint:hover { border-color: var(--accent); }
        .skip {
            height: 26px; padding: 0 6px; border: 0; background: transparent; color: var(--muted); cursor: pointer;
            font: 12px/1 var(--sans); white-space: nowrap; text-decoration: underline; text-underline-offset: 3px;
        }
        .skip:hover { color: var(--text); }
        .samehint {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 6px 12px; padding: 7px 12px;
            border-radius: 8px; background: var(--accent-soft); color: var(--text-2); font-size: 12.5px;
        }
        .samehint .grow { flex: 1; min-width: 200px; }

        .seg { display: inline-flex; flex: none; border: 1px solid var(--border-strong); border-radius: 9px; overflow: hidden; background: var(--surface); }
        .seg button {
            height: 28px; padding: 0 10px; border: 0; border-left: 1px solid var(--border); background: transparent;
            color: var(--muted); font: 500 12.5px/1 var(--sans); cursor: pointer; white-space: nowrap;
        }
        .seg button:first-child { border-left: 0; }
        .seg button:hover:not(:disabled):not(.on) { background: var(--hover); color: var(--text); }
        .seg button.on { background: var(--text); color: var(--bg); font-weight: 600; }
        .seg button.on[data-level="open"] { background: var(--surface-2); color: var(--text); }
        .seg button:disabled:not(.on) { opacity: 0.35; cursor: not-allowed; }

        .savebar {
            /* 用 left/right + margin:auto 置中，不用 left:50% —— 後者會把寬度卡在半個畫面，長一點的說明就被擠成好幾行 */
            position: fixed; left: 16px; right: 16px; bottom: 20px; margin: 0 auto; width: fit-content; z-index: 5;
            display: flex; align-items: center; gap: 10px; max-width: min(980px, calc(100vw - 32px));
            padding: 10px 12px 10px 18px; border-radius: 14px; background: var(--surface);
            border: 1px solid var(--border-strong); box-shadow: 0 8px 30px rgba(20, 20, 19, 0.18);
        }
        .savebar .msg { font-size: 13.5px; color: var(--text-2); min-width: 0; }
        .savebar .msg b { color: var(--text); }
        .savebar .msg .loosen { display: block; font-size: 12.5px; color: var(--danger); max-width: 520px; }
        .savebar .btn { flex: none; }
        body.saving .main, body.saving .sidebar { pointer-events: none; opacity: 0.6; }

        .waiting {
            position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
            background: rgba(20, 20, 19, 0.45);
        }
        .waiting .box {
            width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto;
            padding: 22px 24px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border);
        }
        .waiting .wicon { color: var(--accent); }
        .waiting .wicon svg.i { width: 26px; height: 26px; }
        .waiting h2 { font-family: var(--serif); font-size: 20px; margin: 8px 0 6px; }
        .waiting p { margin: 0 0 10px; color: var(--text-2); font-size: 13.5px; }
        .waiting .wl-title { margin-bottom: 6px; font-weight: 500; color: var(--text); }
        .wlist {
            list-style: none; margin: 0 0 12px; padding: 8px 12px; max-height: 300px; overflow-y: auto;   /* 12 行要一次看得完 */
            background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
            font: 12.5px/1.7 var(--mono); color: var(--code-text); word-break: break-word;
        }
        .waiting .wcount { margin: 0; color: var(--muted); }
        .waiting .wcount b { color: var(--text); font-variant-numeric: tabular-nums; }

        .vs-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }

        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid var(--bg); }
        ::-webkit-scrollbar-track { background: transparent; }

        /* 欄名、建議與四格按鈕排不進一行的寬度：按鈕換到欄名下面，不要把欄名擠到只剩幾個字 */
        @media (max-width: 1100px) {
            .prow { flex-wrap: wrap; }
            .prow .row-main { flex: 1 1 100%; }
        }
        @media (max-width: 900px) {
            body { overflow: auto; height: auto; }
            .topbar { padding: 12px 16px; }
            .toolbar { width: 100%; }
            .select-field, .search-field { flex: 1 1 100%; }
            .select-field select { max-width: none; width: 100%; }
            .search-field input { width: 100%; }
            .search-field kbd { display: none; }
            .btn-ghost .label { display: none; }
            .layout { flex-direction: column; }
            .sidebar { width: auto; border-right: 0; border-bottom: 1px solid var(--border); max-height: 240px; }
            .grid { grid-template-columns: 1fr; }
            .page { padding: 24px 16px 48px; }
            .page-head h1 { font-size: 24px; }
            .brand { flex-wrap: wrap; }
            .viewswitch { margin-left: 0; }
            .levels { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .prow { flex-wrap: wrap; }
            .prow .row-main { flex: 1 1 100%; }
            .seg { max-width: 100%; overflow-x: auto; }
            .savebar { width: auto; flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="brand">
            <span class="mark"><i data-icon="bridge"></i></span>
            <div>
                <div class="brand-name">PBI AI Bridge</div>
                <div class="brand-sub" id="brandSub">模型結構瀏覽</div>
            </div>
            <div class="viewswitch" role="tablist" aria-label="切換檢視">
                <button class="vs active" type="button" role="tab" data-view="model"><i data-icon="table"></i>模型結構</button>
                <button class="vs" type="button" role="tab" data-view="protection"><i data-icon="shield"></i>資料保護<span class="vs-dot" id="protDot" hidden></span></button>
            </div>
        </div>
        <div class="toolbar">
            <label class="field select-field" title="同時開多個 Power BI 時，選擇要看哪一個">
                <i data-icon="window"></i>
                <select id="instancePicker" aria-label="選擇 Power BI">
                    <option value="">偵測中…</option>
                </select>
            </label>
            <label class="field search-field">
                <i data-icon="search"></i>
                <input id="searchInput" type="search" placeholder="搜尋資料表、欄位或量值" autocomplete="off" aria-label="搜尋">
                <kbd>/</kbd>
            </label>
            <button id="refreshBtn" class="btn btn-primary" type="button"><i data-icon="refresh"></i><span>重新掃描</span></button>
            <a class="btn btn-ghost" href="API_Documentation.html" title="API 文件"><i data-icon="book"></i><span class="label">API 文件</span></a>
            <button id="themeBtn" class="btn btn-icon" type="button" aria-label="切換深色／淺色"></button>
        </div>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-head"><span>資料表</span><span id="tableCount"></span></div>
            <nav id="sidebar" class="table-list" aria-label="資料表"></nav>
        </aside>
        <main id="mainContent" class="main"></main>
    </div>

    <div id="saveBar" class="savebar" hidden>
        <div class="msg" id="saveMsg"></div>
        <button id="reviewBtn" class="btn btn-ghost btn-sm" type="button" title="只列出還沒儲存的欄位">檢視</button>
        <button id="discardBtn" class="btn btn-ghost btn-sm" type="button">放棄變更</button>
        <button id="saveBtn" class="btn btn-primary btn-sm" type="button">儲存</button>
    </div>
    <div id="waiting" class="waiting" hidden role="alertdialog" aria-live="assertive" aria-labelledby="waitTitle">
        <div class="box">
            <div class="wicon"><i data-icon="shield"></i></div>
            <h2 id="waitTitle">請到 Windows 跳出的確認視窗回答</h2>
            <p id="waitWhere"></p>
            <div id="waitListWrap">
                <p class="wl-title">視窗裡應該只有這幾項，請逐行對照：</p>
                <ul id="waitList" class="wlist"></ul>
            </div>
            <p class="wcount" id="waitCount">剩 <b id="waitLeft">120</b> 秒。沒有回答會當成「否」，不會有任何變更。</p>
        </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        // ── 圖示（內嵌 SVG，不依賴外部圖示庫）────────────────────────────
        const ICONS = {
            bridge:  '<path d="M3 18h18"/><path d="M5 18v-4a7 7 0 0 1 14 0v4"/><path d="M9 18v-4.5M12 18v-6M15 18v-4.5"/>',
            window:  '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>',
            search:  '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
            refresh: '<path d="M20 11a8 8 0 0 0-14.9-3.5"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3.5"/><path d="M20 20v-4h-4"/>',
            book:    '<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>',
            table:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
            columns: '<path d="M4 6h16M4 12h16M4 18h11"/>',
            sigma:   '<path d="M17 5H7l6 7-6 7h10"/>',
            code:    '<path d="m8 8-4 4 4 4M16 8l4 4-4 4"/>',
            rows:    '<rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/>',
            copy:    '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>',
            check:   '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
            shield:  '<path d="M12 3 4.5 6v5.5c0 4.4 3.1 8.2 7.5 9.5 4.4-1.3 7.5-5.1 7.5-9.5V6z"/>',
            lock:    '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
            plug:    '<path d="M9 3v4M15 3v4"/><path d="M6 7h12v3a6 6 0 0 1-12 0z"/><path d="M12 16v5"/>',
            chevron: '<path d="m9 6 6 6-6 6"/>',
            alert:   '<path d="M12 4 3 20h18z"/><path d="M12 10v5M12 17.5v.5"/>',
            sun:     '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
            moon:    '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
        };
        const svg = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
        const $ = id => document.getElementById(id);
        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        // 伺服器回傳的 JSON 可能是 camelCase 或 PascalCase
        const pick = (o, a, b) => (o == null ? undefined : (o[a] ?? o[b]));

        let tables = [];
        let activeTable = null;
        let exportTime = null;
        let activeTab = 'structure';

        // 目前的檢視：'model'（模型結構）或 'protection'（資料保護）。兩者共用實例選擇、搜尋與深淺色。
        let view = 'model';
        let prot = null;                 // /api/protection 的回應（整理過）
        const pending = new Map();       // 還沒儲存的變更：表 + SEP + 欄 → 等級
        let protFilter = 'all';
        let protNotice = null;           // 頁面頂端的一則訊息：{ tone: 'warn' | 'ok', text }
        let saving = false;              // 正在送出（或正在等確認視窗）：這段時間不接受任何點擊
        let retryAt = 0;                 // 剛被拒絕或逾時：這個時間以前伺服器不會再跳確認視窗
        let guideOpen = null;            // 說明區塊：使用者手動開關過就照他的，否則沒設定過才展開
        let loadGen = 0;                 // 每次重新讀模型加一；晚到的舊回應靠它認出來丟掉
        let autoOpened = new WeakSet();  // 這次重畫時本來就展開的區塊（它們送出的 toggle 不是使用者點的）
        const tableOpen = new Map();     // 使用者手動展開／收合過的資料表

        // ── 深淺色：預設跟隨系統，手動切換後記在這台瀏覽器 ─────────────────
        const THEME_KEY = 'pbi-bridge-theme';
        try { const saved = localStorage.getItem(THEME_KEY); if (saved) document.documentElement.dataset.theme = saved; } catch (e) { }
        const currentTheme = () => document.documentElement.dataset.theme
            || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        function updateThemeButton() {
            const dark = currentTheme() === 'dark';
            $('themeBtn').innerHTML = svg(dark ? 'sun' : 'moon');
            $('themeBtn').title = dark ? '切換為淺色' : '切換為深色';
        }
        function toggleTheme() {
            const next = currentTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.dataset.theme = next;
            try { localStorage.setItem(THEME_KEY, next); } catch (e) { }
            updateThemeButton();
        }

        // ── 金鑰與請求 ──────────────────────────────────────────────────
        // 這個頁面由橋接服務提供（http://localhost:5500/），服務會把金鑰帶進 window.PBI_API_KEY，
        // 使用者不需要貼任何東西。不是從服務開的（直接雙擊 HTML 等）就拿不到金鑰 —— 轉過去或說明怎麼啟動。
        const servedByBridge = location.protocol === 'http:' || location.protocol === 'https:';
        const getApiKey = () => window.PBI_API_KEY || '';
        function apiHeaders() {
            const h = { 'X-API-Key': getApiKey() };
            const target = $('instancePicker').value;
            if (target) h['X-PBI-Target'] = target;
            return h;
        }
        async function readError(res) {
            if (res.status === 401) return '金鑰不符：服務可能重新啟動過，請重新整理頁面（F5）。';
            const text = await res.text();
            return text.replace(/^"|"$/g, '') || `伺服器回應 ${res.status}`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('i[data-icon]').forEach(el => { el.outerHTML = svg(el.dataset.icon); });
            updateThemeButton();
            $('themeBtn').addEventListener('click', toggleTheme);
            $('refreshBtn').addEventListener('click', () => { if (okToDropPending()) fetchSchema(); });
            $('instancePicker').addEventListener('focus', e => { e.target.dataset.prev = e.target.value; });
            $('instancePicker').addEventListener('change', e => {
                if (okToDropPending()) fetchSchema();
                else e.target.value = e.target.dataset.prev || '';     // 不離開：把選單改回原本那個
            });
            // 資料保護檢視每次搜尋都要重排整張清單，等使用者停手再做
            let searchTimer;
            $('searchInput').addEventListener('input', () => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(handleSearch, view === 'protection' ? 150 : 0);
            });
            $('mainContent').addEventListener('click', onMainClick);
            $('mainContent').addEventListener('toggle', onProtToggle, true);   // toggle 不會往上冒泡，要在捕獲階段接
            document.querySelectorAll('.vs').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
            $('saveBtn').addEventListener('click', saveProtection);
            $('discardBtn').addEventListener('click', () => { pending.clear(); protNotice = null; handleSearch(); });
            $('reviewBtn').addEventListener('click', () => { protFilter = 'changed'; tableOpen.clear(); renderProtection(); });
            window.addEventListener('beforeunload', e => { if (pending.size) { e.preventDefault(); e.returnValue = ''; } });
            document.addEventListener('keydown', e => {
                const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName);
                if (e.key === '/' && !typing) { e.preventDefault(); $('searchInput').focus(); }
                if (e.key === 'Escape' && document.activeElement === $('searchInput')) { $('searchInput').value = ''; handleSearch(); }
            });

            if (!servedByBridge) { handleNotServed(); return; }
            fetchSchema();
        });

        function handleNotServed() {
            $('instancePicker').innerHTML = '<option value="">—</option>';
            renderState({ icon: 'refresh', spin: true, title: '正在尋找橋接服務', text: '這個頁面要從服務的網址開啟才能讀取模型。' });
            fetch('http://localhost:5500/ping', { mode: 'no-cors' })
                .then(() => location.replace('http://localhost:5500/'))
                .catch(() => renderState({
                    tone: 'error', icon: 'plug', title: '橋接服務沒有在執行',
                    text: '請雙擊資料夾裡的「🚀啟動PBI終極儀表板.bat」，儀表板會自動打開。',
                }));
        }

        // ── 讀取 ────────────────────────────────────────────────────────
        async function refreshInstances() {
            const picker = $('instancePicker');
            const res = await fetch('/api/instances', { headers: { 'X-API-Key': getApiKey() } });
            if (!res.ok) throw new Error(await readError(res));
            const data = await res.json();
            const list = pick(data, 'instances', 'Instances') || [];

            const previous = picker.value;
            picker.replaceChildren();
            if (list.length === 0) {
                picker.append(new Option('沒有執行中的 Power BI', ''));
                return list;
            }
            // 服務只能從 Power BI 的啟動參數得知檔案路徑。先開 Power BI 再從裡面選檔案的話拿不到路徑，
            // 但還是認得出名字（視窗標題）—— 照樣可以瀏覽、設定資料保護
            const kindLabel = i => (i.kind === 'Unknown' ? '路徑不明' : i.kind);
            list.forEach(i => picker.append(new Option(`${i.fileName || '（未命名）'} · ${kindLabel(i)} · :${i.port}`, i.port)));
            // 盡量保留原本的選擇，避免重新掃描後跳回第一個
            if (previous && list.some(i => String(i.port) === previous)) picker.value = previous;
            return list;
        }

        function setLoading(on) {
            $('refreshBtn').disabled = on;
            $('refreshBtn').querySelector('svg')?.classList.toggle('spin', on);
        }

        async function fetchSchema() {
            const gen = ++loadGen;
            setLoading(true);
            // 換模型或重新掃描：上一份模型還沒儲存的變更到這裡為止（呼叫端已經問過要不要放棄）。
            // 現在就清掉，不等新模型讀完 —— 還在讀、或讀取失敗的時候，儲存列上不能還掛著上一份模型的變更
            prot = null; pending.clear(); protNotice = null; tableOpen.clear(); guideOpen = null;
            $('saveBar').hidden = true;
            updateProtDot();
            $('sidebar').replaceChildren();
            $('tableCount').textContent = '';
            renderState({ icon: 'refresh', spin: true, title: '正在讀取模型結構', text: '從執行中的 Power BI 取得資料表、欄位與量值…' });
            try {
                // 每次掃描前先更新實例清單 —— 使用者可能剛開了新檔案，或關掉了舊的
                const list = await refreshInstances();
                if (gen !== loadGen) return;         // 等回應的時候使用者又按了一次：讓比較新的那一次接手
                if (list.length === 0) {
                    tables = []; activeTable = null;
                    renderState({ icon: 'plug', title: '沒有偵測到 Power BI', text: '請先開啟一份 .pbix 或 .pbip，再按「重新掃描」。服務不需要重開。' });
                    return;
                }
                const res = await fetch('/api/schema', { headers: apiHeaders() });
                if (!res.ok) throw new Error(await readError(res));
                const data = await res.json();
                if (gen !== loadGen) return;
                tables = pick(data, 'tables', 'Tables') || [];
                exportTime = pick(data, 'exportTime', 'ExportTime');
                activeTable = null;
                if (tables.length === 0) { handleSearch(); renderState({ icon: 'table', title: '這份模型沒有資料表', text: '' }); }
                else if (view === 'protection') await loadProtection();
                else { handleSearch(); selectTable(tables[0]); loadProtectionQuiet(); }
            } catch (e) {
                if (gen !== loadGen) return;
                console.error(e);
                if ($('instancePicker').options.length <= 1 && !$('instancePicker').value) {
                    $('instancePicker').innerHTML = '<option value="">無法取得清單</option>';
                }
                renderState({
                    tone: 'error', icon: 'plug', title: '無法讀取模型',
                    checklist: [
                        '服務的黑窗還開著嗎？關掉了的話，請雙擊資料夾裡的「🚀啟動PBI終極儀表板.bat」。',
                        '有沒有開啟任何一份 Power BI 檔案？',
                        '同時開了好幾個 Power BI？請在右上角選擇要看哪一個。',
                    ],
                    detail: e.message,
                });
            } finally {
                if (gen === loadGen) setLoading(false);
            }
        }

        // ── 畫面 ────────────────────────────────────────────────────────
        function renderState({ tone = '', icon = 'table', spin = false, title = '', text = '', checklist = null, detail = '' }) {
            $('mainContent').innerHTML = `
                <div class="state ${tone}">
                    <div class="state-icon">${svg(icon, spin ? 'spin' : '')}</div>
                    <h2>${esc(title)}</h2>
                    ${text ? `<p>${esc(text)}</p>` : ''}
                    ${checklist ? `<ol class="checklist">${checklist.map((c, n) => `<li><b>${n + 1}</b><span>${esc(c)}</span></li>`).join('')}</ol>` : ''}
                    ${detail ? `<div class="detail">${esc(detail)}</div>` : ''}
                </div>`;
        }

        const tableName = t => pick(t, 'name', 'Name') || '';
        const columnsOf = t => pick(t, 'columns', 'Columns') || [];
        const measuresOf = t => pick(t, 'measures', 'Measures') || [];
        const currentQuery = () => $('searchInput').value.trim().toLowerCase();

        // 表名一律加引號、欄名的 ] 要跳脫 —— 這樣複製出去的參照在任何表名下都是合法 DAX
        const daxColumnRef = (t, c) => `'${t.replace(/'/g, "''")}'[${c.replace(/]/g, ']]')}]`;
        const daxMeasureRef = m => `[${m.replace(/]/g, ']]')}]`;

        function countMatches(t, q) {
            if (!q) return 0;
            return columnsOf(t).filter(c => (pick(c, 'name', 'Name') || '').toLowerCase().includes(q)).length
                 + measuresOf(t).filter(m => (pick(m, 'name', 'Name') || '').toLowerCase().includes(q)).length;
        }

        function renderSidebar(list, q) {
            const nav = $('sidebar');
            nav.replaceChildren();
            $('tableCount').textContent = q ? `${list.length} / ${tables.length}` : String(tables.length);
            if (list.length === 0) {
                nav.innerHTML = `<div class="empty-row">${q ? `沒有符合「${esc(q)}」的資料表、欄位或量值` : ''}</div>`;
                return;
            }
            const stats = view === 'protection' && prot ? protTableStats() : null;
            for (const t of list) {
                const hits = countMatches(t, q);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'table-item' + (t === activeTable ? ' active' : '');
                btn.title = tableName(t);
                const s = stats?.get(tableName(t));
                // 資料保護檢視：左側直接看得到每張表有幾欄受限
                const meta = s
                    ? (s.restricted ? `受限 ${s.restricted} · 開放 ${s.open}` : s.open ? `${s.open} 欄全部開放` : '沒有欄位')
                    : `${columnsOf(t).length} 欄位 · ${measuresOf(t).length} 量值`;
                btn.innerHTML = `
                    <span class="name">${svg(s && s.restricted ? 'lock' : 'table')}<span class="t">${esc(tableName(t))}</span>
                        ${pick(t, 'isHidden', 'IsHidden') ? '<span class="badge">隱藏</span>' : ''}
                        ${s && s.suggested ? `<span class="badge badge-match">${s.suggested} 建議</span>` : ''}
                        ${s && s.dirty ? '<span class="vs-dot" title="有還沒儲存的變更"></span>' : ''}
                        ${hits ? `<span class="badge badge-match">${hits} 符合</span>` : ''}</span>
                    <span class="meta">${esc(meta)}</span>`;
                btn.addEventListener('click', () => selectTable(t));
                btn._table = t;
                nav.append(btn);
            }
        }

        function selectTable(t) {
            activeTable = t;
            document.querySelectorAll('.table-item').forEach(el => el.classList.toggle('active', el._table === t));
            if (view === 'protection') { scrollToProtTable(tableName(t)); return; }
            renderTableDetails(t);
            $('mainContent').scrollTop = 0;
        }

        function formatTime(s) {
            const d = new Date(s);
            return isNaN(d) ? String(s) : d.toLocaleString('zh-TW', { hour12: false });
        }

        function renderTableDetails(t) {
            const name = tableName(t);
            const cols = columnsOf(t);
            const meas = measuresOf(t);
            const m = pick(t, 'mQuery', 'MQuery');
            const q = currentQuery();
            const isHit = n => q && (n || '').toLowerCase().includes(q);

            const colRows = cols.map(c => {
                const cn = pick(c, 'name', 'Name') || '';
                return `
                    <li class="row${isHit(cn) ? ' hit' : ''}">
                        <div class="row-main">
                            <div class="row-name">${esc(cn)}${pick(c, 'isHidden', 'IsHidden') ? '<span class="badge">隱藏</span>' : ''}</div>
                            <div class="row-sub">${esc(pick(c, 'dataType', 'DataType') || '')}</div>
                        </div>
                        <button class="copy" type="button" data-copy="${esc(daxColumnRef(name, cn))}" title="複製 DAX 參照" aria-label="複製 ${esc(cn)} 的 DAX 參照">${svg('copy')}</button>
                    </li>`;
            }).join('');

            const measRows = meas.map(x => {
                const mn = pick(x, 'name', 'Name') || '';
                const expr = pick(x, 'expression', 'Expression');
                return `
                    <li class="row measure${isHit(mn) ? ' hit' : ''}">
                        <div class="row-main">
                            <div class="row-name">${esc(mn)}${pick(x, 'isHidden', 'IsHidden') ? '<span class="badge">隱藏</span>' : ''}</div>
                            ${expr ? `<pre class="dax">${esc(expr)}</pre>` : ''}
                        </div>
                        <button class="copy" type="button" data-copy="${esc(daxMeasureRef(mn))}" title="複製量值參照" aria-label="複製 ${esc(mn)} 的參照">${svg('copy')}</button>
                    </li>`;
            }).join('');

            const mPane = m
                ? `<div class="notice">${svg('shield')}<span>M 腳本可能含有連線字串、伺服器位址或寫死的篩選值。截圖或貼給別人之前，請先確認內容。</span></div>
                   <div class="code-block">
                       <div class="code-toolbar"><span>Power Query M · ${m.split('\n').length} 行</span>
                           <button class="btn btn-ghost btn-sm" type="button" data-copy-m>${svg('copy')}<span>複製全部</span></button></div>
                       <pre id="mCode">${esc(m)}</pre>
                   </div>`
                : `<div class="state" style="margin-top:6vh">
                       <div class="state-icon">${svg('code')}</div>
                       <h2>這張表沒有 M 腳本</h2>
                       <p>可能是 DAX 計算表、計算群組，或只用來放量值的表。</p>
                   </div>`;

            $('mainContent').innerHTML = `
                <div class="page">
                    <div class="page-head">
                        <div>
                            <h1>${esc(name)}</h1>
                            <p>${cols.length} 個欄位 · ${meas.length} 個量值${pick(t, 'isHidden', 'IsHidden') ? ' · 隱藏的資料表' : ''}</p>
                        </div>
                        ${exportTime ? `<div class="sync"><span class="dot"></span>讀取於 ${esc(formatTime(exportTime))}</div>` : ''}
                    </div>
                    <div class="tabs" role="tablist">
                        <button class="tab${activeTab === 'structure' ? ' active' : ''}" type="button" role="tab" data-tab="structure">${svg('rows')}結構</button>
                        <button class="tab${activeTab === 'm' ? ' active' : ''}" type="button" role="tab" data-tab="m">${svg('code')}Power Query</button>
                    </div>
                    <section data-pane="structure"${activeTab === 'structure' ? '' : ' hidden'}>
                        <div class="grid">
                            <div class="card">
                                <div class="card-head"><h2>${svg('columns')}欄位</h2><span class="badge">${cols.length}</span></div>
                                <ul class="rows">${colRows || '<li class="empty-row">沒有實體欄位</li>'}</ul>
                            </div>
                            <div class="card">
                                <div class="card-head"><h2>${svg('sigma')}量值</h2><span class="badge">${meas.length}</span></div>
                                <ul class="rows">${measRows || '<li class="empty-row">這張表沒有量值</li>'}</ul>
                            </div>
                        </div>
                    </section>
                    <section data-pane="m"${activeTab === 'm' ? '' : ' hidden'}>${mPane}</section>
                </div>`;
        }

        function onMainClick(e) {
            if (view === 'protection') { onProtClick(e); return; }
            const tab = e.target.closest('[data-tab]');
            if (tab) {
                activeTab = tab.dataset.tab;
                document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('active', b === tab));
                document.querySelectorAll('[data-pane]').forEach(p => { p.hidden = p.dataset.pane !== activeTab; });
                return;
            }
            const copyBtn = e.target.closest('[data-copy]');
            if (copyBtn) { copyText(copyBtn.dataset.copy); return; }
            if (e.target.closest('[data-copy-m]')) copyText($('mCode').textContent, '整段 M 腳本');
        }

        // ── 搜尋 ────────────────────────────────────────────────────────
        function handleSearch() {
            const q = currentQuery();
            const list = q
                ? tables.filter(t => tableName(t).toLowerCase().includes(q) || countMatches(t, q) > 0)
                : tables;
            renderSidebar(list, q);
            if (view === 'protection') { if (prot) renderProtection(); return; }
            if (q.length >= 2 && list.length === 1 && list[0] !== activeTable) selectTable(list[0]);
            else if (activeTable) renderTableDetails(activeTable);   // 更新符合項目的標示
        }

        // ── 資料保護 ────────────────────────────────────────────────────
        // 這裡只負責顯示與收集變更。規則由伺服器執行 —— 尤其「放寬」：按下儲存後，
        // 服務會自己跳出 Windows 確認視窗，使用者在那裡按「是」才生效，這個頁面（或任何拿得到金鑰的程式）繞不過去。
        const LEVELS = [
            { key: 'open',          label: '開放',     tip: 'AI 可以直接讀內容' },
            { key: 'pseudonym',     label: '換成代號', tip: 'AI 可以分組統計，但看到的是代號，不是真名' },
            { key: 'countOnly',     label: '只能計數', tip: 'AI 只能數有幾個，不能列出、不能分組' },
            { key: 'aggregateOnly', label: '只能彙總', tip: 'AI 只能拿加總、平均、最大最小，不能一筆一筆看' },
        ];
        const LEVEL_LABEL = Object.fromEntries(LEVELS.map(l => [l.key, l.label]));
        const SEP = '\u0001';
        const keyOf = (t, c) => t + SEP + c;
        const TYPE_LABEL = { String: '文字', Int64: '數字', Double: '數字', Decimal: '數字', DateTime: '日期', Boolean: '是／否' };
        // 和伺服器同一條規則：改成「只能計數」、或原本就是開放，都不算放寬
        const isLoosening = (from, to) => to !== from && to !== 'countOnly' && from !== 'open';
        const levelNow = (t, c) => pending.get(keyOf(t, c.name)) ?? c.level;
        // 這一欄現在是不是掛著一個還沒處理的建議（套用或略過之後就不算）
        const hasOpenHint = (t, c) => !!c.suggested && c.level === 'open'
            && !pending.has(keyOf(t, c.name)) && !local.dismissed.has(keyOf(t, c.name));
        // 和伺服器比對欄名的方式一致：忽略大小寫、空白、底線、連字號
        const normName = s => s.toLowerCase().replace(/[ _-]/g, '');

        // 只屬於這個瀏覽器的記號：哪些建議略過了、這份模型是不是「看過了，不用改」。
        // 刻意不存到伺服器 —— 伺服器分不出送請求的是你還是 AI；存在那裡的話，AI 可以替你把建議全部略過。
        let local = { reviewed: false, dismissed: new Set() };
        const localKey = () => 'pbi-bridge-prot:' + prot.modelId;
        function loadLocal() {
            local = { reviewed: false, dismissed: new Set() };
            if (!prot?.modelId) return;
            try {
                const o = JSON.parse(localStorage.getItem(localKey()) || '{}');
                local = { reviewed: !!o.reviewed, dismissed: new Set(Array.isArray(o.dismissed) ? o.dismissed : []) };
            } catch (e) { }
        }
        function saveLocal() {
            if (!prot?.modelId) return;
            try { localStorage.setItem(localKey(), JSON.stringify({ reviewed: local.reviewed, dismissed: [...local.dismissed] })); } catch (e) { }
        }
        function setProt(p) { prot = p; loadLocal(); }
        // 確認視窗裡每一行的寫法（和伺服器的一模一樣，使用者才能逐行對照）
        const changeLine = (t, c, from, to) => `'${t}'[${c}]：${LEVEL_LABEL[from] || from} → ${LEVEL_LABEL[to] || to}`;

        function okToDropPending() {
            if (pending.size === 0) return true;
            return confirm(`資料保護有 ${pending.size} 項還沒儲存。要放棄嗎？`);
        }

        function setView(v) {
            if (v === view) return;
            view = v;                                        // 切換檢視不會丟掉還沒儲存的變更
            document.querySelectorAll('.vs').forEach(b => b.classList.toggle('active', b.dataset.view === v));
            $('brandSub').textContent = v === 'protection' ? 'AI 能讀什麼' : '模型結構瀏覽';
            $('searchInput').placeholder = v === 'protection' ? '搜尋欄位，例如：客戶、金額' : '搜尋資料表、欄位或量值';
            $('saveBar').hidden = true;
            if (tables.length === 0) return;                 // 還沒讀到模型：維持目前的狀態畫面
            if (v === 'protection') { if (prot) handleSearch(); else loadProtection(); }
            else { handleSearch(); selectTable(activeTable || tables[0]); }
        }

        function normalizeProt(d) {
            const g = (o, k) => pick(o, k, k[0].toUpperCase() + k.slice(1));
            return {
                enabled: !!g(d, 'enabled'), file: g(d, 'file') || '', canSave: !!g(d, 'canSave'),
                configured: !!g(d, 'configured'), problem: g(d, 'problem') || '', savedAt: g(d, 'savedAt') || '',
                modelId: g(d, 'modelId') || '', pathKnown: g(d, 'pathKnown') !== false, inheritedFrom: g(d, 'inheritedFrom') || '',
                maxLoosen: Number(g(d, 'maxLoosenPerConfirm')) || 12,
                confirmTimeout: Number(g(d, 'confirmTimeoutSeconds')) || 120,
                limits: g(d, 'limits') || {},
                stale: (g(d, 'stale') || []).map(s => ({ table: g(s, 'table'), column: g(s, 'column'), level: g(s, 'level') })),
                tables: (g(d, 'tables') || []).map(t => ({
                    name: g(t, 'name') || '', isHidden: !!g(t, 'isHidden'),
                    columns: (g(t, 'columns') || []).map(c => ({
                        name: g(c, 'name') || '', dataType: g(c, 'dataType') || '', numeric: !!g(c, 'numeric'),
                        isHidden: !!g(c, 'isHidden'), level: g(c, 'level') || 'open', source: g(c, 'source') || 'default',
                        rule: g(c, 'rule') || '', suggested: g(c, 'suggested') || '', suggestedWhy: g(c, 'suggestedWhy') || '',
                    })),
                })),
            };
        }

        async function fetchProtection() {
            const res = await fetch('/api/protection', { headers: apiHeaders() });
            if (res.status === 404) throw new Error('執行中的服務是舊版，還沒有這個功能。請關掉黑窗，重新雙擊「🚀啟動PBI終極儀表板.bat」。');
            if (!res.ok) throw new Error(await readError(res));
            return normalizeProt(await res.json());
        }

        async function loadProtection() {
            $('saveBar').hidden = true;
            renderState({ icon: 'refresh', spin: true, title: '正在讀取資料保護設定', text: '' });
            const gen = loadGen;
            try {
                const p = await fetchProtection();
                if (gen !== loadGen) return;         // 等回應的時候使用者換了模型：這份已經不是現在要看的
                setProt(p);
                handleSearch();                      // 會連帶畫出側欄與主畫面
            } catch (e) {
                if (gen !== loadGen) return;
                console.error(e);
                prot = null;
                renderState({ tone: 'error', icon: 'shield', title: '無法讀取資料保護設定', detail: e.message });
            }
        }

        // 在「模型結構」檢視先悄悄讀一次：分頁上的小圓點才知道這份模型設定過沒有
        function loadProtectionQuiet() {
            const gen = loadGen;
            fetchProtection().then(p => {
                if (gen !== loadGen || prot) return;
                setProt(p);
                updateProtDot();
                if (view === 'protection') handleSearch();
            }).catch(() => { });
        }

        function updateProtDot() {
            const dot = $('protDot');
            let why = '';
            if (pending.size > 0) why = `有 ${pending.size} 項還沒儲存`;
            else if (prot && prot.enabled && prot.canSave && !prot.problem) {
                let hints = 0;
                for (const t of prot.tables) for (const c of t.columns) if (hasOpenHint(t.name, c)) hints++;
                if (hints > 0) why = `有 ${hints} 個欄位建議設成受限`;
                else if (!prot.configured && !local.reviewed) why = '這份模型還沒設定過';
            }
            dot.hidden = !why;
            dot.title = why;
        }

        // 設定檔讀不出來時要先重設，報表還沒存檔時沒有地方記 —— 這兩種狀況都不能改
        const canEdit = () => prot.canSave && !prot.problem;
        function findProtTable(name) { return prot.tables.find(t => t.name === name); }
        function findCol(tName, cName) { return findProtTable(tName)?.columns.find(c => c.name === cName); }

        function protTableStats() {
            const m = new Map();
            for (const t of prot.tables) {
                const s = { open: 0, restricted: 0, suggested: 0, dirty: 0 };
                for (const c of t.columns) {
                    if (levelNow(t.name, c) === 'open') s.open++; else s.restricted++;
                    if (hasOpenHint(t.name, c)) s.suggested++;
                    if (pending.has(keyOf(t.name, c.name))) s.dirty++;
                }
                m.set(t.name, s);
            }
            return m;
        }

        function protTotals(stats) {
            const n = { total: 0, open: 0, restricted: 0, suggested: 0 };
            stats.forEach(s => { n.open += s.open; n.restricted += s.restricted; n.suggested += s.suggested; });
            n.total = n.open + n.restricted;
            return n;
        }

        function rowVisible(t, c, q) {
            const lv = levelNow(t.name, c);
            if (protFilter === 'open' && lv !== 'open') return false;
            if (protFilter === 'restricted' && lv === 'open') return false;
            if (protFilter === 'suggested' && !hasOpenHint(t.name, c)) return false;
            if (protFilter === 'changed' && !pending.has(keyOf(t.name, c.name))) return false;
            if (q && !(c.name.toLowerCase().includes(q) || t.name.toLowerCase().includes(q))) return false;
            return true;
        }

        function rowHtml(t, c, q) {
            const lv = levelNow(t.name, c);
            const dirty = pending.has(keyOf(t.name, c.name));
            // 欄名下面那一行：只在有話要說的時候才有內容
            let note = '';
            if (dirty) note =`原本：${esc(LEVEL_LABEL[c.level] || c.level)} → ${esc(LEVEL_LABEL[lv] || lv)}　`
                + (isLoosening(c.level, lv) ? '<span class="loosen">放寬，儲存時要你確認</span>' : '收緊');
            else if (c.source === 'explicit') note = '你設定的';
            else if (c.source === 'pattern') note = `通用規則 ${esc(c.rule)}`;
            const hint = hasOpenHint(t.name, c) && canEdit()
                ? `<span class="hintwrap"><button class="hint" type="button" data-hint="${esc(c.suggested)}" title="${esc(c.suggestedWhy)}">建議：${esc(LEVEL_LABEL[c.suggested] || c.suggested)}</button>`
                + '<button class="skip" type="button" data-skip title="維持開放，之後不再提示這一欄">略過</button></span>' : '';
            const buttons = LEVELS.map(l => {
                const off = l.key === 'aggregateOnly' && !c.numeric;
                return `<button type="button" role="radio" aria-checked="${l.key === lv}" data-level="${l.key}" class="${l.key === lv ? 'on' : ''}"`
                     + ` title="${off ? '只有數字欄位能用' : l.tip}"${off || !canEdit() ? ' disabled' : ''}>${l.label}</button>`;
            }).join('');
            return `<li class="prow${lv === 'open' ? '' : ' restricted'}${dirty ? ' dirty' : ''}${q && c.name.toLowerCase().includes(q) ? ' hit' : ''}" data-c="${esc(c.name)}">
                        <div class="row-main">
                            <div class="row-name">${lv === 'open' ? '' : svg('lock', 'lock')}${esc(c.name)}${c.isHidden ? '<span class="badge">隱藏</span>' : ''}</div>
                            <div class="src">${esc(TYPE_LABEL[c.dataType] || c.dataType)}${note ? ' · ' + note : ''}</div>
                        </div>
                        ${hint}
                        <div class="seg" role="radiogroup" aria-label="${esc(c.name)} 的保護等級">${buttons}</div>
                    </li>`;
        }

        function tableRowsHtml(t, q) {
            const rows = t.columns.filter(c => rowVisible(t, c, q)).map(c => rowHtml(t, c, q)).join('');
            return rows || '<li class="empty-row">這張表沒有符合篩選條件的欄位</li>';
        }

        // 預設要不要攤開這張表。budget.left：這次重畫還能攤開幾列 ——
        // 上千列一起畫會頓，所以有搜尋或篩選時由上往下攤，攤到額度用完為止，其餘的只留表頭。
        function isTableOpen(t, stats, total, narrowed, visible, budget) {
            if (tableOpen.has(t.name)) return tableOpen.get(t.name);
            if (narrowed) return visible <= budget.left;
            if (total <= 300) return true;                   // 欄位不多：全部攤開，一眼看完
            const s = stats.get(t.name);
            return s.restricted > 0 || s.suggested > 0;      // 欄位很多：只攤開有受限或有建議的表
        }

        const tableCountHtml = s => (s.restricted ? `<span class="r">受限 ${s.restricted}</span> · ` : '')
            + `開放 ${s.open}` + (s.suggested ? ` · <span class="s">建議 ${s.suggested}</span>` : '');

        function chipsHtml(n) {
            const chip = (key, label, count, todo) =>
                `<button class="chip${protFilter === key ? ' active' : ''}${todo ? ' todo' : ''}" type="button" data-filter="${key}">${label} <b>${count}</b></button>`;
            return chip('all', '全部', n.total) + chip('open', '開放', n.open) + chip('restricted', '受限', n.restricted)
                 + (n.suggested ? chip('suggested', '有建議', n.suggested, true) : '')
                 + (pending.size ? chip('changed', '未儲存', pending.size, true) : '');
        }

        function renderProtection() {
            if (!prot) return;
            const q = currentQuery();
            const stats = protTableStats();
            const n = protTotals(stats);
            // 篩選的對象沒了（變更都儲存或放棄了、建議都處理完了）就回到全部，不要留下一片空白
            if ((protFilter === 'changed' && pending.size === 0) || (protFilter === 'suggested' && n.suggested === 0)) protFilter = 'all';
            const narrowed = !!q || protFilter !== 'all';
            const lim = k => esc(pick(prot.limits, k, k[0].toUpperCase() + k.slice(1)) ?? '');
            const banner = (tone, icon, html, buttons = '', attrs = '') =>
                `<div class="notice${tone === 'warn' ? ' warn' : ''}"${attrs}>${svg(icon)}<span class="grow">${html}</span>${buttons}</div>`;

            const notices = [];
            if (protNotice) notices.push(banner(protNotice.tone, protNotice.tone === 'warn' ? 'alert' : 'check', esc(protNotice.text)));
            if (prot.problem) notices.push(banner('warn', 'alert',
                '這份模型的保護設定檔讀不出來。為了安全，AI 的查詢現在全部被擋下。按「重設」清掉重來（會跳出確認視窗）。',
                '<button class="btn btn-ghost btn-sm" type="button" data-reset>重設</button>'));
            if (!prot.enabled) notices.push(banner('warn', 'alert',
                '<b>資料保護目前是關閉的</b>：AI 可以讀到任何欄位的內容，這一頁的設定不會生效。要開啟，把 pbibridge_csharp\\appsettings.json 裡 DataProtection 的 Enabled 改成 true，關掉黑窗，再重新雙擊啟動檔。'));
            if (!prot.canSave) notices.push(banner('', 'alert',
                '服務認不出這份報表（沒有檔名，模型裡也還沒有可以辨識的欄位），設定沒有地方記。先在 Power BI 按 Ctrl+S 存檔，再回來按「重新掃描」。'));
            if (prot.inheritedFrom) notices.push(banner('', 'check',
                `這份模型沿用了先前存下來的設定（當時的檔案：${esc(prot.inheritedFrom)}）。同一份模型換了位置、改了檔名，或這次是從 Power BI 裡面開啟的，設定都會跟著它。`));
            if (prot.stale.length) notices.push(banner('', 'alert',
                `有 ${prot.stale.length} 筆設定對不到現在的欄位（可能改名或刪除了）。受限的設定仍會套用到同名的欄位。`,
                '<button class="btn btn-ghost btn-sm" type="button" data-clear-stale>清除這些設定</button>'));
            if (canEdit() && prot.enabled && !prot.configured && !local.reviewed) notices.push(banner('', 'shield',
                '<b>這份模型還沒設定過。</b>現在只有通用規則在擋，而通用規則只認得英文欄名（customer、amount…）—— 中文欄位幾乎都是開放的。看一遍下面的欄位，把不該讓 AI 看內容的設成受限。',
                '<button class="btn btn-ghost btn-sm" type="button" data-reviewed title="這份模型不需要調整：不再顯示這則提醒">看過了，不用改</button>'));
            if (canEdit()) notices.push(banner('', 'shield',
                `有 <b id="sugCount">${n.suggested}</b> 個開放中的欄位，名稱看起來像人或公司、備註、金額。建議只會收緊，不會放寬；套用後還要按「儲存」才生效。`,
                '<button class="btn btn-ghost btn-sm" type="button" data-filter="suggested">先看一下</button>'
                + '<button class="btn btn-primary btn-sm" type="button" data-apply-suggestions>套用全部建議</button>',
                ` id="sugNotice"${n.suggested ? '' : ' hidden'}`));

            const visibleOf = new Map(prot.tables.map(t => [t.name, t.columns.filter(c => rowVisible(t, c, q)).length]));
            let shown = 0;
            visibleOf.forEach(v => { shown += v; });
            const budget = { left: 300 };
            let folded = 0;                      // 因為額度用完而沒攤開的表
            const tablesHtml = prot.tables.map(t => {
                // 沒有東西可列的表不畫：被搜尋或篩選濾光的，以及只放量值、沒有欄位的
                const visible = visibleOf.get(t.name);
                if (visible === 0 && (narrowed || t.columns.length === 0)) return '';
                const isOpen = isTableOpen(t, stats, n.total, narrowed, visible, budget);
                if (isOpen) budget.left -= visible; else if (narrowed) folded++;
                return `<details class="card ptable" data-table="${esc(t.name)}"${isOpen ? ' open' : ''}>
                    <summary>
                        ${svg('chevron', 'caret')}
                        <span class="grow"><span class="tname">${esc(t.name)}</span>
                            <span class="tcount">${tableCountHtml(stats.get(t.name))}</span></span>
                    </summary>
                    <ul class="rows">${isOpen ? tableRowsHtml(t, q) : ''}</ul>
                </details>`;
            }).join('');

            // 一次設定很多欄：對象是「現在列出來的全部」。只收緊 —— 放寬要逐列點，確認視窗才列得完。
            let bulk = '';
            if (canEdit() && narrowed && shown > 0) bulk = `<div class="bulk"><span>把列出的 <b>${shown}</b> 個欄位設為</span>
                        <button class="btn btn-ghost btn-sm" type="button" data-bulk="pseudonym">換成代號</button>
                        <button class="btn btn-ghost btn-sm" type="button" data-bulk="countOnly">只能計數</button>
                        <button class="btn btn-ghost btn-sm" type="button" data-bulk="aggregateOnly">只能彙總</button>
                        ${protFilter === 'suggested' ? '<button class="btn btn-ghost btn-sm" type="button" data-skip-listed>這些都維持開放</button>' : ''}
                        <span class="fine">只會收緊；會變成放寬的不動。</span></div>`;
            else if (canEdit() && n.total > 30) bulk = '<div class="bulk muted">欄位很多？先用右上角的搜尋或上面的篩選縮小範圍，就能把列出來的欄位一次設好。</div>';

            const empty = `<div class="empty-row">${q ? `沒有符合「${esc(q)}」的欄位` : '沒有符合的欄位'}</div>`;
            const main = $('mainContent');
            const keepScroll = main.querySelector('.prot') ? main.scrollTop : 0;
            main.innerHTML = `
                <div class="page prot">
                    <div class="page-head">
                        <div>
                            <h1>資料保護</h1>
                            <p>AI 在雲端，它讀到的內容都會離開這台電腦。欄位名稱 AI 一定看得到；這裡決定的是每個欄位「裡面的內容」它能看到多少。</p>
                        </div>
                        <div class="sync"><span class="dot"></span>${esc(prot.file)}${prot.pathKnown ? '' : '（路徑不明）'} · ${prot.savedAt ? '上次儲存 ' + esc(prot.savedAt.slice(0, 16)) : '尚未設定'}</div>
                    </div>
                    ${notices.join('')}
                    <details class="guide"${(guideOpen ?? !prot.configured) ? ' open' : ''}>
                        <summary>四種等級是什麼？怎麼設定？</summary>
                        <div class="levels">
                            <div class="level open"><h3>開放</h3>
                                <p>AI 可以直接讀內容（逐列明細每次最多 ${lim('maxDetailRows')} 列，分組彙總 ${lim('maxAggregateRows')} 列）—— 多問幾次就讀得完，所以請當作它全部看得到。</p>
                                <div class="eg">產品線＝筆電、桌機、伺服器</div></div>
                            <div class="level"><h3>換成代號</h3>
                                <p>AI 可以數有幾個、按它分組、排出前幾名；看不到真正的名字。</p>
                                <div class="eg">ID_3FA2B81C07｜12,345,678</div>
                                <p class="fit">適合客戶、經銷商、業務員的名稱。代號不是加密：同一個客戶永遠是同一個代號，客戶不多或特徵明顯時還是猜得出是誰。代號是誰，看黑窗。</p></div>
                            <div class="level"><h3>只能計數</h3>
                                <p>AI 可以數有幾個、有幾筆是空的；不能列出內容，也不能按它分組。</p>
                                <div class="eg">客戶數＝1,503</div>
                                <p class="fit">適合電話、Email、地址、備註 —— AI 不需要看內容的欄位。</p></div>
                            <div class="level"><h3>只能彙總</h3>
                                <p>只有數字欄位能選。AI 可以加總、平均、取最大最小，也可以按別的欄位分組來算（最多 ${lim('maxRowsWithMoney')} 列）；不能一筆一筆列出來。</p>
                                <div class="eg">筆電｜總額 12,345,678</div>
                                <p class="fit">注意：條件篩到只剩一筆時，加總就等於那一筆。</p></div>
                        </div>
                        <h4>三個步驟</h4>
                        <ol>
                            <li>按「套用全部建議」—— 名稱像客戶、聯絡方式、備註、金額的欄位會先標成受限。</li>
                            <li>用搜尋補漏：打「客戶」「金額」這類字，把列出來的欄位一次設好。看到誤判的，點回「開放」。</li>
                            <li>按「儲存」。收緊馬上生效；放寬會跳出 Windows 確認視窗，你按「是」才算數。</li>
                        </ol>
                        <p class="fine">為什麼放寬要多按一次：AI 和這個頁面用的是同一把鑰匙，少了你親手按的那一下，AI 可以自己把保護關掉。確認視窗是服務自己跳出來的，只有坐在電腦前的人按得到 —— 所以你沒有按儲存卻跳出視窗時，請按「否」。<br>
                        做不到的事：「只能計數」擋的是列出與分組，AI 仍然可以問「有沒有叫某某的客戶」這種答案是數字的問題。</p>
                    </details>
                    <div class="prot-toolbar">${chipsHtml(n)}</div>
                    ${bulk}
                    <div id="protTables">${tablesHtml || empty}</div>
                    ${folded ? `<div class="empty-row">還有 ${folded} 張表收合著（列太多，一次全攤開會頓）—— 點表名展開，或把搜尋範圍再縮小一點。上面的「把列出的欄位設為…」仍然涵蓋全部 ${shown} 個。</div>` : ''}
                </div>`;
            main.scrollTop = keepScroll;
            autoOpened = new WeakSet(main.querySelectorAll('details[open]'));
            updateSaveBar();
        }

        function pendingSplit() {
            const tighten = [], loosen = [];
            for (const [k, to] of pending) {
                const [Table, Column] = k.split(SEP);
                const from = findCol(Table, Column)?.level ?? 'open';
                (isLoosening(from, to) ? loosen : tighten).push({ Table, Column, Level: to, from });
            }
            // 和伺服器用同一個順序（照確認視窗那一行的文字逐字元比），等待畫面才能和視窗逐行對照
            const line = c => changeLine(c.Table, c.Column, c.from, c.Level);
            const byLine = (a, b) => { const x = line(a), y = line(b); return x < y ? -1 : x > y ? 1 : 0; };
            return { tighten: tighten.sort(byLine), loosen: loosen.sort(byLine) };
        }

        function updateSaveBar() {
            const bar = $('saveBar');
            updateProtDot();
            if (view !== 'protection' || !prot || pending.size === 0) { bar.hidden = true; return; }
            const { tighten, loosen } = pendingSplit();
            const wait = Math.ceil((retryAt - Date.now()) / 1000);
            const rounds = Math.ceil(loosen.length / prot.maxLoosen);
            $('saveMsg').innerHTML = `<b>${pending.size}</b> 項未儲存：收緊 ${tighten.length} · 放寬 ${loosen.length}`
                + (loosen.length ? `<span class="loosen">這次有放寬的項目。按「儲存」後 Windows 會跳出確認視窗，要你本人按「是」才會生效${rounds > 1 ? `（一次最多 ${prot.maxLoosen} 欄，會分 ${rounds} 次問）` : ''}。</span>` : '');
            // 剛被拒絕或逾時：伺服器短時間內不會再跳視窗。只剩放寬要送的話，等倒數完再讓人按
            const mustWait = wait > 0 && tighten.length === 0;
            $('saveBtn').disabled = saving || mustWait;
            $('saveBtn').textContent = mustWait ? `${wait} 秒後可以再試` : '儲存';
            $('discardBtn').disabled = saving;
            bar.hidden = false;
        }

        let retryTimer = null;
        function startRetryCountdown(seconds) {
            retryAt = Date.now() + seconds * 1000;
            clearInterval(retryTimer);
            retryTimer = setInterval(() => {
                if (Date.now() >= retryAt) { retryAt = 0; clearInterval(retryTimer); }
                updateSaveBar();
            }, 1000);
        }

        function sameNameOpen(tName, c) {
            const name = normName(c.name), out = [];
            for (const t of prot.tables) for (const x of t.columns)
                if (!(t.name === tName && x.name === c.name) && normName(x.name) === name && levelNow(t.name, x) === 'open') out.push([t, x]);
            return out;
        }

        // 改一個欄位：只重畫那一列與各處的計數，不重畫整頁（一千多欄時整頁重畫會頓）
        function setLevel(tName, cName, level, li) {
            const t = findProtTable(tName);
            const c = t?.columns.find(x => x.name === cName);
            if (!c || !canEdit() || saving || (level === 'aggregateOnly' && !c.numeric)) return;
            const k = keyOf(tName, cName);
            if (level === c.level) pending.delete(k); else pending.set(k, level);
            protNotice = null;
            if (li) {
                if (li.nextElementSibling?.classList.contains('samehint')) li.nextElementSibling.remove();
                li.insertAdjacentHTML('afterend', rowHtml(t, c, currentQuery()));
                const fresh = li.nextElementSibling;
                li.remove();
                // 同名的欄位散在別張表：只設這一欄的話，其他表的照樣讀得到
                const twins = level === 'open' ? [] : sameNameOpen(tName, c);
                if (twins.length) {
                    const where = [...new Set(twins.map(([tt]) => tt.name))];
                    fresh.insertAdjacentHTML('afterend', `<li class="samehint"><span class="grow">另外 ${twins.length} 個欄位也叫「${esc(c.name)}」（${esc(where.slice(0, 3).join('、'))}${where.length > 3 ? ` 等 ${where.length} 張表` : ''}），目前是開放。</span>
                        <button class="btn btn-ghost btn-sm" type="button" data-same-apply="${esc(level)}">一起設為${esc(LEVEL_LABEL[level])}</button></li>`);
                }
            }
            refreshProtCounts();
        }

        // 略過建議：這一欄維持開放，這個瀏覽器不再提示它
        function dismissHint(tName, cName, li) {
            const t = findProtTable(tName);
            const c = t?.columns.find(x => x.name === cName);
            if (!c) return;
            local.dismissed.add(keyOf(tName, cName));
            saveLocal();
            if (li) li.outerHTML = rowHtml(t, c, currentQuery());
            refreshProtCounts();
        }

        function refreshProtCounts() {
            const stats = protTableStats();
            const n = protTotals(stats);
            document.querySelectorAll('.ptable').forEach(el => {
                const s = stats.get(el.dataset.table);
                const span = el.querySelector('.tcount');
                if (s && span) span.innerHTML = tableCountHtml(s);
            });
            const bar = document.querySelector('.prot-toolbar');
            if (bar) bar.innerHTML = chipsHtml(n);
            if ($('sugNotice')) { $('sugNotice').hidden = n.suggested === 0; $('sugCount').textContent = n.suggested; }
            const q = currentQuery();
            renderSidebar(q ? tables.filter(t => tableName(t).toLowerCase().includes(q) || countMatches(t, q) > 0) : tables, q);
            updateSaveBar();
        }

        function scrollToProtTable(name) {
            const el = [...document.querySelectorAll('.ptable')].find(d => d.dataset.table === name);
            if (!el) return;
            if (!el.open) el.open = true;        // 會觸發 toggle，由 onProtToggle 補上欄位列
            el.scrollIntoView({ block: 'start', behavior: 'smooth' });
        }

        function onProtToggle(e) {
            const el = e.target;
            if (view !== 'protection' || !prot) return;
            // 畫面重畫時本來就展開的區塊也會送出 toggle。那不是使用者點的，不能記成「他手動展開過」——
            // 記了的話，之後每次重畫都會照樣全部展開，一次畫幾百列的上限就沒用了
            if (autoOpened.delete(el) && el.open) return;
            if (el.classList?.contains('guide')) { guideOpen = el.open; return; }
            if (!el.classList?.contains('ptable')) return;
            tableOpen.set(el.dataset.table, el.open);
            const ul = el.querySelector('ul.rows');
            if (el.open && ul && !ul.children.length) {
                const t = findProtTable(el.dataset.table);
                if (t) ul.innerHTML = tableRowsHtml(t, currentQuery());
            }
        }

        // 現在列出來的欄位（套用搜尋與篩選之後）。先收集再動手 —— 篩選條件本身會跟著 pending 變
        function listedColumns() {
            const q = currentQuery(), out = [];
            for (const t of prot.tables) for (const c of t.columns) if (rowVisible(t, c, q)) out.push([t, c]);
            return out;
        }

        function bulkSet(level) {
            let marked = 0, untouched = 0;
            for (const [t, c] of listedColumns()) {
                const k = keyOf(t.name, c.name);
                if ((level === 'aggregateOnly' && !c.numeric) || isLoosening(c.level, level)) { untouched++; continue; }
                if (level === c.level) { if (pending.delete(k)) marked++; continue; }
                if (pending.get(k) !== level) { pending.set(k, level); marked++; }
            }
            protNotice = null;
            renderProtection(); refreshProtCounts();
            showToast(`已標記 ${marked} 個。` + (untouched ? `${untouched} 個沒有動（會變成放寬，或不是數字欄位）。` : '') + '按「儲存」才會生效', 3200);
        }

        function onProtClick(e) {
            if (!prot || saving) return;
            const seg = e.target.closest('.seg [data-level]');
            const hintBtn = e.target.closest('[data-hint]');
            const skipBtn = e.target.closest('[data-skip]');
            if (seg || hintBtn || skipBtn) {
                const li = e.target.closest('.prow');
                const tName = li?.closest('.ptable')?.dataset.table;
                if (!li || !tName) return;
                if (skipBtn) dismissHint(tName, li.dataset.c, li);
                else setLevel(tName, li.dataset.c, seg ? seg.dataset.level : hintBtn.dataset.hint, li);
                return;
            }
            const same = e.target.closest('[data-same-apply]');
            if (same) {
                const row = same.closest('.samehint').previousElementSibling;
                const tName = row?.closest('.ptable')?.dataset.table;
                const c = tName && findCol(tName, row.dataset.c);
                if (!c) return;
                const level = same.dataset.sameApply;
                let done = 0;
                for (const [t, x] of sameNameOpen(tName, c)) {
                    const k = keyOf(t.name, x.name);
                    if ((level === 'aggregateOnly' && !x.numeric) || isLoosening(x.level, level)) continue;
                    if (level === x.level) pending.delete(k); else pending.set(k, level);
                    done++;
                }
                renderProtection(); refreshProtCounts();
                showToast(`已標記另外 ${done} 個同名欄位。按「儲存」才會生效`, 3200);
                return;
            }
