            const filter = e.target.closest('[data-filter]');
            if (filter) { protFilter = filter.dataset.filter; tableOpen.clear(); renderProtection(); return; }
            if (e.target.closest('[data-apply-suggestions]')) {
                let marked = 0;
                for (const t of prot.tables) for (const c of t.columns)
                    if (hasOpenHint(t.name, c)) { pending.set(keyOf(t.name, c.name), c.suggested); marked++; }
                protFilter = 'changed'; tableOpen.clear(); protNotice = null;
                renderProtection(); refreshProtCounts();
                showToast(`已標記 ${marked} 個。看過一遍，誤判的點回「開放」，再按「儲存」`, 3600);
                return;
            }
            const bulkBtn = e.target.closest('[data-bulk]');
            if (bulkBtn) { bulkSet(bulkBtn.dataset.bulk); return; }
            if (e.target.closest('[data-skip-listed]')) {
                let marked = 0;
                for (const [t, c] of listedColumns())
                    if (hasOpenHint(t.name, c)) { local.dismissed.add(keyOf(t.name, c.name)); marked++; }
                saveLocal();
                renderProtection(); refreshProtCounts();
                showToast(`已略過 ${marked} 個建議，這些欄位維持開放`, 3200);
                return;
            }
            if (e.target.closest('[data-reviewed]')) {
                local.reviewed = true;
                saveLocal();
                renderProtection();
                return;
            }
            if (e.target.closest('[data-clear-stale]')) {
                runWholeChange({ Changes: prot.stale.map(s => ({ Table: s.table, Column: s.column, Level: 'default' })) });
                return;
            }
            if (e.target.closest('[data-reset]')) runWholeChange({ Reset: true });
        }

        // ── 儲存 ────────────────────────────────────────────────────────
        async function postProtection(body) {
            try {
                const res = await fetch('/api/protection', {
                    method: 'POST', headers: { ...apiHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body),
                });
                const text = await res.text();
                let j = null;
                try { j = JSON.parse(text); } catch (e) { }
                if (res.ok) return { ok: true, data: j || {} };
                if (res.status === 401) return { ok: false, reason: '金鑰不符：服務可能重新啟動過，請重新整理頁面（F5）。' };
                const o = j && typeof j === 'object' ? j : null;
                return {
                    ok: false,
                    answer: String(pick(o, 'answer', 'Answer') || '').toLowerCase(),
                    retryAfter: Number(pick(o, 'retryAfterSeconds', 'RetryAfterSeconds')) || 0,
                    reason: (o ? pick(o, 'reason', 'Reason') || pick(o, 'error', 'Error') || pick(o, 'detail', 'Detail')
                               : typeof j === 'string' ? j : text) || `伺服器回應 ${res.status}`,
                };
            } catch (e) {
                return { ok: false, reason: `沒有連上服務：${e.message}` };
            }
        }

        // 沒獲得同意時要對使用者說什麼。伺服器回的 answer 分得出是按了否、沒人回答，還是根本跳不出視窗。
        // what：這次沒有發生的事（「放寬的項目沒有變更，還留在待儲存」／「沒有做任何變更」）
        function refusalText(r, what) {
            const s = r.retryAfter || 30;
            switch (r.answer) {
                case 'no':          return `你選了「否」，${what}。${s} 秒後可以再送一次。`;
                case 'timeout':     return `確認視窗沒有人回答，當成「否」，${what}。視窗可能在另一個螢幕，或沒有跳到最前面 —— ${s} 秒後再試一次，然後按 Alt+Tab 找它。`;
                case 'busy':        return '已經有另一個確認視窗開著 —— 它不是這次跳出來的（多半是 AI 送出的請求）。先看清楚那個視窗在問什麼，不是你要的就按「否」，再回來試一次。';
                case 'coolingdown': return `剛剛才按過「否」或逾時，${s} 秒後可以再試。${what}。`;
                case 'unavailable': return '這台電腦現在跳不出確認視窗，所以沒辦法放寬。收緊不受影響。';
                default:            return r.reason;
            }
        }

        let waitTimer = null;
        // lines：這一次送出的放寬清單；null 表示清單由伺服器決定（重設、清除殘留設定）。
        // unsure：不確定會不會跳視窗（照理不會、或要看伺服器怎麼算）—— 這時不倒數，也不說「請去回答」，
        //         免得使用者去找一個不存在的視窗，或把別人送出的視窗當成自己的來回答
        function showWaiting(lines, round, rounds, unsure = false) {
            const until = Date.now() + (prot?.confirmTimeout || 120) * 1000;
            $('waitTitle').textContent = unsure ? '正在儲存…'
                : '請到 Windows 跳出的確認視窗回答' + (rounds > 1 ? `（第 ${round}／${rounds} 次）` : '');
            $('waitWhere').textContent = unsure
                ? '如果 Windows 跳出確認視窗（標題是「PBI AI Bridge — 請確認要放寬資料保護」），請到那裡回答。它可能在另一個螢幕，或沒有跳到最前面 —— 按 Alt+Tab 找。'
                : '標題是「PBI AI Bridge — 請確認要放寬資料保護」。沒看到？它可能在另一個螢幕，或沒有跳到最前面 —— 按 Alt+Tab 找，或看工作列有沒有多出一顆按鈕。';
            $('waitListWrap').hidden = !lines;
            $('waitList').innerHTML = (lines || []).map(l => `<li>${esc(l)}</li>`).join('');
            $('waitCount').hidden = unsure;
            const tick = () => { $('waitLeft').textContent = Math.max(0, Math.ceil((until - Date.now()) / 1000)); };
            tick();
            clearInterval(waitTimer);
            waitTimer = setInterval(tick, 500);
            $('waiting').hidden = false;
        }
        function hideWaiting() { clearInterval(waitTimer); $('waiting').hidden = true; }

        function setSaving(on) {
            saving = on;
            document.body.classList.toggle('saving', on);
            updateSaveBar();
        }

        // 儲存之後重新讀一次，並把已經存進去的項目從待儲存拿掉（沒送成的留著）
        async function reloadProtection() {
            const gen = loadGen;
            try {
                const p = await fetchProtection();
                if (gen !== loadGen) return;                 // 這段時間使用者換了模型：這份回應已經不是現在這一份的
                setProt(p);
                for (const [k, to] of [...pending]) {
                    const [tn, cn] = k.split(SEP);
                    const c = findCol(tn, cn);
                    if (!c || to === c.level) pending.delete(k);
                }
            } catch (e) {
                const extra = `重新讀取設定時失敗（${e.message}），畫面上的等級可能不是最新的 —— 請按「重新掃描」。`;
                protNotice = { tone: 'warn', text: protNotice ? protNotice.text + ' ' + extra : extra };
            }
            tableOpen.clear();
            handleSearch();
        }

        // 按一次「儲存」分兩段送：先送收緊（不必確認，立刻生效），再送放寬（每次最多 maxLoosen 欄，各跳一次確認視窗）。
        // 這樣錯過確認視窗時，丟掉的只有放寬 —— 第一次設定收緊的那幾百欄不會跟著沒存到。
        async function saveProtection() {
            if (!prot || pending.size === 0 || saving) return;
            const { tighten, loosen } = pendingSplit();
            const strip = list => list.map(({ Table, Column, Level }) => ({ Table, Column, Level }));
            let tightened = 0, loosened = 0, failure = null;
            setSaving(true);
            protNotice = null;
            try {
                if (tighten.length) {
                    // 照理不會跳確認視窗；萬一伺服器的判斷和這裡不同，等太久就把指路的畫面叫出來
                    const slow = setTimeout(() => showWaiting(null, 1, 1, true), 1500);
                    const r = await postProtection({ Changes: strip(tighten) });
                    clearTimeout(slow); hideWaiting();
                    if (!r.ok) failure = r;
                    else { tightened = tighten.length; tighten.forEach(c => pending.delete(keyOf(c.Table, c.Column))); }
                }
                const wait = Math.ceil((retryAt - Date.now()) / 1000);
                if (!failure && loosen.length && wait > 0) failure = { answer: 'coolingdown', retryAfter: wait };
                const rounds = Math.ceil(loosen.length / prot.maxLoosen);
                for (let i = 0; i < rounds && !failure; i++) {
                    const part = loosen.slice(i * prot.maxLoosen, (i + 1) * prot.maxLoosen);
                    showWaiting(part.map(c => changeLine(c.Table, c.Column, c.from, c.Level)), i + 1, rounds);
                    const r = await postProtection({ Changes: strip(part) });
                    hideWaiting();
                    if (!r.ok) failure = r;
                    else { loosened += part.length; part.forEach(c => pending.delete(keyOf(c.Table, c.Column))); }
                }
                if (failure) {
                    if (failure.retryAfter && failure.answer !== 'busy') startRetryCountdown(failure.retryAfter);
                    const done = [tightened ? `收緊的 ${tightened} 項已經生效` : '', loosened ? `已放寬 ${loosened} 項` : ''].filter(Boolean).join('，');
                    protNotice = {
                        tone: 'warn',
                        text: refusalText(failure, loosened ? '其餘放寬的項目沒有變更，還留在待儲存' : '放寬的項目沒有變更，還留在待儲存')
                            + (done ? ` ${done}。` : ''),
                    };
                }
                // 重新讀完之前都算「儲存中」：這段時間畫面上還是舊的等級，點了會被新資料蓋掉
                if (tightened || loosened) {
                    await reloadProtection();
                    if (!failure) showToast(`已儲存：收緊 ${tightened} 欄、放寬 ${loosened} 欄`, 2600);
                }
            } finally {
                hideWaiting();
                setSaving(false);
                if (prot && view === 'protection') renderProtection();
            }
        }

        // 重設、清除殘留設定：會變寬鬆的欄位由伺服器算，清單只出現在確認視窗裡
        async function runWholeChange(body) {
            if (saving) return;
            setSaving(true);
            protNotice = null;
            try {
                const slow = setTimeout(() => showWaiting(null, 1, 1, true), 600);
                const r = await postProtection(body);
                clearTimeout(slow); hideWaiting();
                if (!r.ok) {
                    if (r.retryAfter && r.answer !== 'busy') startRetryCountdown(r.retryAfter);
                    protNotice = { tone: 'warn', text: refusalText(r, '沒有做任何變更') };
                    return;
                }
                if (body.Reset) pending.clear();
                await reloadProtection();
                showToast(pick(r.data, 'message', 'Message') || '已儲存', 2600);
            } finally {
                hideWaiting();
                setSaving(false);
                if (prot && view === 'protection') renderProtection();
            }
        }

        // ── 複製 ────────────────────────────────────────────────────────
        async function copyText(text, label) {
            try {
                await navigator.clipboard.writeText(text);
            } catch (e) {
                const ta = Object.assign(document.createElement('textarea'), { value: text });
                document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove();
            }
            showToast(`已複製 ${label || text}`);
        }

        let toastTimer;
        function showToast(message, ms = 1800) {
            const toast = $('toast');
            toast.innerHTML = svg('check');
            const span = document.createElement('span');
            span.textContent = message;
            toast.append(span);
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
        }
    </script>
</body>
</html>
